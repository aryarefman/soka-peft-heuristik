---
# Service NodePort: pintu masuk tiap VM dari laptop (localhost:3000x -> VM).
apiVersion: v1
kind: Service
metadata: { name: vm-1 }
spec:
  type: NodePort
  selector: { vm: vm-1 }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30001 }]
